# Сборка установщика под Windows (NSIS) + автообновление через electron-updater.
# Лента обновлений — релизы GitHub репозитория 4one-rp-dev/launcher (теги v*): latest.yml и установщик.
appId: com.4onerp.launcher
productName: 4ONE Launcher
copyright: 4ONE RP
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - "!src/renderer/**/*.md"
  - build/icon.png
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: 4ONE-Launcher-Setup-${version}.${ext}
  # Подпись кода: задайте CSC_LINK / CSC_KEY_PASSWORD (или win.certificateFile).
  # Без подписи SmartScreen покажет предупреждение.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 4ONE Launcher
  deleteAppDataOnUninstall: false
protocols:
  - name: 4ONE Launcher
    schemes: [gta4one]
publish:
  provider: github
  owner: 4one-rp-dev
  repo: launcher
  releaseType: release
